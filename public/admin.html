<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NETFLIM Studio</title><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><main class="admin-shell"><a class="wordmark" href="/">NETFLIM</a><section class="admin-login" id="login-view"><p class="eyebrow">NETFLIM STUDIO</p><h1>Administrator login</h1><p>Manage your collection from one secure place.</p><form id="login-form"><label>Email<input required type="email" name="email" placeholder="admin@netflim.com"></label><label>Password<input required type="password" name="password" placeholder="••••••••"></label><button class="button button-primary">Sign in</button><p class="form-message"></p></form></section><section class="dashboard hidden" id="dashboard"><div class="dashboard-title"><div><p class="eyebrow">CONTENT MANAGER</p><h1>Publish a new story</h1></div><button class="logout">Log out</button></div><form id="movie-form" enctype="multipart/form-data" class="movie-form"><label>Title<input name="title" required placeholder="Movie title"></label><label>Genre<input name="genre" placeholder="Drama, Thriller..."></label><label>Year<input name="year" type="number" placeholder="2026"></label><label>Duration<input name="duration" placeholder="1h 45m"></label><label>Maturity rating<input name="maturity" placeholder="U/A 13+"></label><label class="full">Description<textarea name="description" placeholder="Tell viewers what this story is about..."></textarea></label><label>Poster image<input name="posterFile" type="file" accept="image/*"><small>or paste a URL below</small><input name="poster" type="url" placeholder="https://..."></label><label>Backdrop image<input name="backdropFile" type="file" accept="image/*"><small>or paste a URL below</small><input name="backdrop" type="url" placeholder="https://..."></label><label class="check"><input name="featured" type="checkbox"> Make this the featured banner</label><button class="button button-primary full">Upload movie</button><p class="form-message full"></p></form><div class="admin-list"><h2>Current collection</h2><div id="admin-movies"></div></div></section></main><script src="env.js"></script><script src="app.js"></script></body></html>
